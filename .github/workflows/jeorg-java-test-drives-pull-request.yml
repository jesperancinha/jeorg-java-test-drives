name: JJTD jeorg-java-test-drives pull-request

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'adopt'

        - name: Build and Test
          run:  mvn clean install -DskipTests &&
                mvn test jacoco:prepare-agent package jacoco:report
